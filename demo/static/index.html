<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cornerwork · Coaching between classes</title>
<style>
:root{--ink:#213e39;--muted:#697970;--paper:#f5f4ec;--card:#fffef8;--line:#dce1d6;--teal:#336c5e;--pale:#e8eee3;--orange:#b6673d;--red:#a54737}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ba784d;outline-offset:3px}button{border:0;border-radius:8px;padding:10px 15px;background:var(--teal);color:white;font-weight:650}button.secondary{background:var(--pale);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.small{font-size:12px;padding:6px 10px}input,select,textarea{width:100%;border:1px solid #cbd3c7;background:var(--card);padding:10px 12px;border-radius:8px;color:var(--ink)}textarea{resize:vertical;min-height:100px}label{display:block;font-size:12px;font-weight:650;margin-bottom:6px}h1,h2,h3,p{margin:0}h1{font-family:Georgia,serif;font-size:38px;line-height:1.16;letter-spacing:-1px;font-weight:500}h2{font-size:19px}h3{font-size:15px}small,.muted{color:var(--muted)}.demo-banner{background:#e6eadb;text-align:center;padding:8px 20px;font-size:12px;border-bottom:1px solid #d4ddcc}.shell{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 35px)}nav{background:var(--ink);color:#f4f5e9;padding:30px 18px;display:flex;flex-direction:column;gap:6px}.brand{font-family:Georgia,serif;font-size:28px;letter-spacing:-1px;padding:0 12px 4px}.brandmark{display:inline-block;width:15px;height:20px;border-left:4px solid #b4c6a9;border-bottom:4px solid #b4c6a9;margin-right:7px}.strap{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#b8c6b9;padding:0 12px 30px}nav button{background:none;color:#c5d4c9;text-align:left;font-weight:500;padding:13px 14px}nav button.active{background:#36534b;color:white}nav .nav-bottom{margin-top:auto;padding:35px 12px 0;font-size:11px;color:#b6c6ba}.nav-divider{height:1px;background:#3b554a;margin:18px 12px}.content{padding:35px 42px;max-width:1550px;width:100%}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:30px}.role{background:var(--pale);padding:6px 12px;border-radius:50px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.heading p{margin-top:10px;color:var(--muted);max-width:620px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:750;color:var(--teal);margin-bottom:9px}.grid{display:grid;gap:20px;min-width:0}.grid>*{min-width:0}.two{grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:23px}.card+.card{margin-top:16px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:var(--pale);color:var(--teal);font-size:11px;font-weight:650;line-height:1.5}.badge.warn{background:#f5e7d6;color:#87562d}.badge.danger{background:#f6e4dd;color:var(--red)}.badge.gray{background:#eceee9;color:#677166}.row{display:flex;gap:12px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:15px}.avatar{flex:0 0 38px;height:38px;display:grid;place-items:center;background:#e3e9da;border-radius:50%;font-family:Georgia,serif;color:var(--teal)}.log{margin-bottom:16px}.log .summary{font-size:16px;margin:17px 0 12px}.tags{display:flex;flex-wrap:wrap;gap:6px}.meta{font-size:11px;color:var(--muted)}.quote{margin:15px 0;padding:12px 15px;border-left:2px solid #b3c2a6;background:#f5f5ed;color:#657468;font-size:13px;white-space:pre-wrap}.reply{margin-top:16px;border-top:1px solid var(--line);padding-top:17px}.reply textarea{min-height:82px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.focus{background:var(--ink);color:#f5f5e9;border-color:var(--ink)}.focus .eyebrow,.focus .muted{color:#b9c8b6}.focus p{font-family:Georgia,serif;font-size:24px;line-height:1.35;margin-top:10px}.roster-row{padding:15px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:start}.roster-row:last-child{border-bottom:0}.roster-info{flex:1;min-width:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.metric{padding:21px}.metric strong{display:block;font-family:Georgia,serif;font-size:35px;font-weight:500;margin:7px 0}.metric label{color:var(--muted);font-weight:500}.note{font-size:12px;color:var(--muted);margin-top:12px}.notice{padding:13px 16px;background:#edf0e5;border-radius:8px;font-size:13px;margin-bottom:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}td,th{padding:12px 8px;border-bottom:1px solid var(--line)}th{font-size:11px;color:var(--muted);font-weight:650}details{margin-top:14px}summary{cursor:pointer;font-size:12px;color:var(--teal)}.phone{background:#e9ede1;padding:18px;border-radius:15px}.phone-header{text-align:center;border-bottom:1px solid #cfd8c7;padding-bottom:14px;margin-bottom:15px}.bubble{max-width:90%;padding:11px 13px;border-radius:13px;background:white;font-size:13px;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.in{background:#365f51;color:white;margin-left:auto}.messages{max-height:410px;overflow:auto}.event{overflow-wrap:anywhere;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.event code{color:var(--teal)}code{font-size:12px;overflow-wrap:anywhere}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.toolbar>div{flex:1;min-width:140px}#toast{position:fixed;bottom:22px;right:24px;max-width:440px;background:var(--ink);color:white;padding:14px 20px;border-radius:10px;box-shadow:0 7px 25px #213e3922;z-index:5}#toast.error{background:#963d30}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:20px 0}a{color:var(--teal)}.loading{padding:60px;text-align:center}.sample{font-size:11px;color:var(--muted);margin-top:8px}
@media(min-width:1300px){.content{padding:40px 58px}}@media(max-width:1000px){.shell{grid-template-columns:180px 1fr}.content{padding:28px 24px}.two{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}@media(max-width:650px){.shell{display:block}nav{padding:16px;display:block}.brand{display:inline-block;font-size:25px;padding:0 0 10px}.strap,.nav-bottom,.nav-divider{display:none}nav button{padding:8px 10px;font-size:12px;display:inline-block}.nav-links{display:flex;overflow:auto;gap:3px}.content{padding:22px 16px}.topline{margin-bottom:22px}.heading{display:block}.heading>button{margin-top:15px}.card{padding:18px}.metric{padding:15px}.metric strong{font-size:29px}.demo-banner{font-size:10px;padding:7px 12px}.role{font-size:10px}#toast{right:15px;left:15px}.row{gap:9px;min-width:0}.event .row{flex-wrap:wrap}.event .row>*{min-width:0}}
</style></head><body>
<div class="demo-banner"><strong>LOCAL DEMO</strong> · Fictional people · Simulated SMS, AI summaries and voice transcription · No real messages or billing</div>
<div class="shell"><nav aria-label="Main navigation"><div class="brand"><span class="brandmark"></span>cornerwork</div><div class="strap">Keep the coaching going</div><div class="nav-links"><button data-tab="inbox" class="active">Coach inbox</button><button data-tab="brief">Before class</button><button data-tab="owner">Owner overview</button><div class="nav-divider"></div><button data-tab="simulator">Demo tools</button><button data-tab="activity">Message & event log</button></div><div class="nav-bottom">Between the last round<br>and the next class.<br><br>One gym. One coaching loop.</div></nav>
<main class="content"><div class="topline"><span id="gym-name">Cornerwork demo gym</span><span class="role" id="role-label">Coach view · demo role</span></div><div id="screen"><div class="loading">Loading the training floor…</div></div></main></div><div id="toast" role="status" class="hidden"></div>
<script>
'use strict';
let state={},tab='inbox',inboxFilter='pending',selectedPhone='',currentBrief=null,selectedClass=1;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const initials=n=>String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('');
const fmt=t=>{if(!t)return '—';let d=new Date(t);return isNaN(d)?esc(t):d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});};
const badge=(s,kind='')=>`<span class="badge ${kind}">${esc(s)}</span>`;
const athlete=id=>arr(state.athletes).find(a=>a.id===id)||{};
const name=l=>l.athlete_name||l.name||athlete(l.athlete_id).name||'Athlete';
const role=()=>['owner','activity','simulator'].includes(tab)?'owner':'coach';
function toast(s,error=false){$('#toast').textContent=s;$('#toast').className=error?'error':'';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').className='hidden',5500);}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j;try{j=await r.json()}catch{throw Error('The local server did not return a valid response.')}if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail||j));return j;}
async function refresh(){state=await api('/api/state?role='+role());$('#gym-name').textContent=state.gym?.name||state.gym_name||'Cornerwork demo gym';$('#role-label').textContent=(role()==='owner'?'Owner':'Coach')+' view · demo role, no authentication';if(!selectedPhone)selectedPhone=arr(state.athletes).find(a=>a.status==='active')?.phone||'';render();}
async function action(fn){let buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await fn()}catch(e){toast(e.message,true)}finally{buttons.forEach(b=>b.disabled=false)}}
function heading(kicker,title,copy,extra=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${copy}</p></div>${extra}</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({inbox:renderInbox,brief:renderBrief,owner:renderOwner,simulator:renderSimulator,activity:renderActivity}[tab])();}
function logReplied(l){return !!(l.reply||l.replied||l.reply_body||arr(l.replies).length||arr(state.replies).some(r=>r.log_id===l.id));}
function renderInbox(){const logs=arr(state.logs),pending=logs.filter(l=>!logReplied(l));const shown=inboxFilter==='pending'?pending:logs;$('#screen').innerHTML=heading('The coaching loop','A little feedback. A lot of progress.','Read what happened after class, then send the next useful thought.')+`<div class="grid two"><section><div class="card-head"><h2>${inboxFilter==='pending'?'Waiting for you':'All training logs'} ${badge(shown.length)}</h2><div class="row"><button class="ghost small" id="refresh-inbox">Refresh</button><button class="ghost small" id="filter">${inboxFilter==='pending'?'Show all logs':'Show unanswered'}</button></div></div>${shown.length?shown.map(logCard).join(''):'<div class="card empty">You’re caught up. Send a session log from Demo tools to keep the loop going.</div>'}</section><aside><div class="card focus"><div class="eyebrow">The human part stays human</div><p>A summary helps you see it.<br>Your reply makes it coaching.</p><div class="note" style="color:#bdcbb9">Demo summaries use simple rules. Read the original before replying.</div></div><div class="card"><h3>Try the whole loop</h3><p class="note">1. Open Demo tools and send a training log.<br><br>2. Review it here and write a coach reply.<br><br>3. See the simulated SMS, then open Before class.</p><button class="secondary" style="margin-top:18px" data-go="simulator">Open demo tools →</button></div></aside></div>`;$('#refresh-inbox').onclick=()=>action(refresh);$('#filter').onclick=()=>{inboxFilter=inboxFilter==='pending'?'all':'pending';renderInbox()};bindGo();document.querySelectorAll('[data-reply]').forEach(f=>f.onsubmit=e=>{e.preventDefault();action(async()=>{await api('/api/reply',{log_id:Number(f.dataset.reply),body:f.querySelector('textarea').value});toast('Coach reply added to the simulated outbox.');await refresh()})});document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{let l=logs.find(x=>x.id===Number(b.dataset.draft));b.closest('form').querySelector('textarea').value=l.coach_draft||l.parsed?.coach_draft||'Thanks for sharing this. Let’s talk through it before your next class.';});}
function logCard(l){let parsed=typeof l.parsed==='object'?l.parsed:l;let replies=arr(l.replies).length?l.replies:arr(state.replies).filter(r=>r.log_id===l.id);if(l.reply)replies=[typeof l.reply==='object'?l.reply:{body:l.reply,sent_at:l.replied_at}];let injury=l.injury||parsed.injury;return `<article class="card log"><div class="row between"><div class="row"><div class="avatar">${esc(initials(name(l)))}</div><div><h3>${esc(name(l))}</h3><div class="meta">${fmt(l.created_at)} · ${String(l.kind).includes('voice')?'Simulated voice transcript':'Text log'} · #${l.id}</div></div></div>${logReplied(l)?badge('Replied'):badge('Needs reply','warn')}</div><p class="summary">${esc(l.summary||parsed.summary||l.transcript||l.body)}</p><div class="tags">${l.sentiment||parsed.sentiment?badge(({pos:'Positive',neg:'Negative',neutral:'Neutral'})[l.sentiment||parsed.sentiment]||l.sentiment||parsed.sentiment,'gray'):''}${arr(l.techniques||parsed.techniques).map(t=>badge(t)).join('')}${injury?badge('Injury concern'+(injury.area?' · '+injury.area:''),'warn'):''}${l.concussion_flag||parsed.concussion_flag?badge('Head injury concern · review now','danger'):''}</div><details><summary>Read original message</summary><div class="quote">${esc(l.transcript||l.body||l.raw_text)}</div></details>${replies.length?replies.map(r=>`<div class="reply"><div class="meta">Coach reply · ${fmt(r.sent_at||r.created_at)}</div><p>${esc(r.body)}</p></div>`).join(''):logReplied(l)?'<p class="note">Coach has replied.</p>':`<form class="reply" data-reply="${l.id}"><label for="reply-${l.id}">Your reply</label><textarea id="reply-${l.id}" required maxlength="2000" placeholder="One useful thought for the next session…"></textarea><div class="actions"><button type="submit">Send simulated SMS</button><button type="button" class="ghost small" data-draft="${l.id}">Use demo draft</button></div><div class="note">Drafts never send automatically. You review and send.</div></form>`}</article>`;}
function renderBrief(){let b=currentBrief||state.brief||{};let members=arr(b.athletes||b.roster||b.members);$('#screen').innerHTML=heading('Before the first round','Walk in knowing your people.','Booked athletes, recent context and one focus for the session.')+`<div class="toolbar"><div><label for="class-select">Class</label><select id="class-select">${arr(state.classes).map(c=>`<option value="${c.id}" ${Number(c.id)===Number(selectedClass)?'selected':''}>${esc(c.name)}${c.start_time?' · '+esc(c.start_time):''}</option>`).join('')||'<option value="1">Demo class</option>'}</select></div><div><label for="class-date">Class date</label><input type="date" id="class-date" value="${esc(b.class_date||b.date||state.demo_date||new Date().toISOString().slice(0,10))}"></div><button id="generate">Refresh brief</button></div><div class="grid two"><section class="card"><div class="card-head"><h2>${esc(b.class_name||b.name||'Class roster')}</h2>${badge(members.length+' booked')}</div>${members.length?members.map(a=>`<div class="roster-row"><div class="avatar">${esc(initials(a.name||a.athlete_name))}</div><div class="roster-info"><h3>${esc(a.name||a.athlete_name)}</h3>${a.goal?`<p class="note"><strong>Goal:</strong> ${esc(a.goal)}</p>`:''}<p class="note">${esc(a.summary||a.latest_summary||'No recent training context.')}</p><div class="tags" style="margin-top:8px">${[...new Map(arr(a.flags).map(f=>[typeof f==='string'?f:f.type+' '+f.detail,f])).values()].map(f=>badge(typeof f==='string'?f:((f.type||'Flag')+(f.detail?' · '+f.detail:'')),typeof f==='object'&&f.type==='concussion'?'danger':typeof f==='object'&&f.type==='injury'?'warn':'')).join('')}</div></div></div>`).join(''):'<div class="empty">No bookings for this class and date. Import bookings from Owner overview.</div>'}</section><aside><div class="card focus"><div class="eyebrow">Suggested focus · demo rules</div><p>${esc(b.focus||b.suggested_focus||'Listen first. Review the roster and recent logs before choosing a focus.')}</p></div><div class="card"><h3>What’s coming up in the logs</h3><div class="tags" style="margin-top:16px">${arr(b.themes).map(t=>badge(typeof t==='string'?t:t.theme||t.name)).join('')||'<span class="muted">No themes yet.</span>'}</div><p class="note">Generated from stored bookings and recent logs. A flag is context to review, not medical advice.</p></div></aside></div>`;$('#generate').onclick=()=>action(async()=>{selectedClass=Number($('#class-select').value);currentBrief=await api('/api/brief?class_id='+selectedClass+'&date='+$('#class-date').value);renderBrief();toast('Class brief refreshed from current training logs.')});}
function renderOwner(){let m=state.metrics||{},drift=arr(m.drift||m.drift_candidates||state.drift_candidates||state.drift),concerns=arr(state.concerns);let logging=m.weekly_logging_rate??m.logging_rate;let pct=logging==null?'—':Math.round(logging)+'%';let hours=m.median_reply_hours??(m.median_reply_seconds==null?null:m.median_reply_seconds/3600);$('#screen').innerHTML=heading('Owner overview','See where a conversation could help.','Activity from this demo’s stored records. Signals support a human check-in; they don’t explain why someone is absent.')+`<div class="metrics"><div class="card metric"><label>Active opt-ins</label><strong>${esc(m.active_athletes??m.opt_ins??arr(state.athletes).filter(a=>a.status==='active').length)}</strong><small>Confirmed adult participants</small></div><div class="card metric"><label>Logging · last 7 days</label><strong>${pct}</strong><small>${esc(m.weekly_loggers??0)} of ${esc(m.active_athletes??0)} active participants</small></div><div class="card metric"><label>Median reply time</label><strong>${hours==null?'—':Number(hours).toFixed(1)+'h'}</strong><small>Logs with a coach reply</small></div><div class="card metric"><label>Worth a check-in</label><strong>${drift.length}</strong><small>No activity for 10+ days</small></div></div><div class="notice">${arr(m.per_coach).map(c=>`${esc(c.name)}: ${esc(c.replies)} replies · median ${c.median_reply_hours==null?'—':esc(c.median_reply_hours)+'h'}`).join(' · ')}<br>Coach replies: ${esc(m.reply_rate??0)}% of logs · ${esc(m.within_48h_rate??0)}% within 48 hours · ${esc(m.unanswered_logs??0)} awaiting a reply.</div><div class="grid two"><section><div class="card"><div class="card-head"><h2>A personal check-in</h2>${badge(drift.length+' people','warn')}</div>${drift.length?`<div class="tablewrap"><table><thead><tr><th>Athlete</th><th>Last activity / context</th></tr></thead><tbody>${drift.map(a=>`<tr><td>${esc(a.name||a.athlete_name)}</td><td>${esc(a.reason||a.days_inactive&&a.days_inactive+' days without activity'||a.last_activity||'No log or attendance in 10+ days')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No inactivity signals in the current data.</p>'}<p class="note">Drift means no training log or recorded attendance for 10+ days. If neither exists, it is measured from membership start. Bookings do not count as attendance.</p></div><div class="card"><h2>Restricted concerns</h2><p class="note">Owner view only. No content is shared with the coaching inbox. This demo role switch is not access control.</p>${concerns.length?concerns.map(c=>`<div class="quote"><strong>${esc(c.name||c.athlete_name||athlete(c.athlete_id).name||'Athlete')}</strong><br>${esc(c.body||c.detail||c.transcript||c.message)}<br><small>${fmt(c.at||c.created_at)}</small></div>`).join(''):'<p class="note">No concerns routed to the owner.</p>'}</div></section><aside><div class="card"><h2>Bring in a roster</h2><p class="note">CSV import only. No live gym-system integration. Importing a person does not opt them in.</p><form id="import-form" class="stack" style="margin-top:18px"><div><label for="import-kind">Import type</label><select id="import-kind"><option value="athletes">Athletes</option><option value="bookings">Bookings</option></select></div><div><label for="csv">CSV contents</label><textarea id="csv" rows="6" required spellcheck="false"></textarea><div class="sample" id="csv-help"></div></div><button>Import CSV</button></form></div></aside></div><div class="card"><h2>Roster & consent status</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Member since</th></tr></thead><tbody>${arr(state.athletes).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.phone)}</td><td>${badge(a.status,a.status==='active'?'':'gray')}</td><td>${esc(a.membership_start||'—')}</td></tr>`).join('')}</tbody></table></div></div>`;const example=()=>{let bookings=$('#import-kind').value==='bookings';$('#csv').value=bookings?'class_id,phone,class_date,status\n1,'+(arr(state.athletes)[0]?.phone||'+15550001001')+','+(state.brief?.class_date||state.brief?.date||new Date().toISOString().slice(0,10))+',booked':'name,phone,membership_start\nDemo Visitor,+15550009999,2026-09-01';$('#csv-help').textContent=bookings?'Use a roster phone number and an existing class ID.':'E.164 phone format, e.g. +15550009999. New members must JOIN and confirm adulthood.';};$('#import-kind').onchange=example;example();$('#import-form').onsubmit=e=>{e.preventDefault();action(async()=>{let r=await api('/api/import',{kind:$('#import-kind').value,csv:$('#csv').value});toast('CSV imported. '+(r.rows??r.count??r.imported??'')+' records processed.');await refresh()})};}
function renderSimulator(){let people=arr(state.athletes),coaches=arr(state.users||state.coaches);if(!coaches.length&&state.gym?.coach_phone)coaches=[{name:state.gym.coach,phone:state.gym.coach_phone}];$('#screen').innerHTML=heading('Owner demo tools · not an athlete portal','Put the coaching loop in motion.','Simulate the SMS channel locally. Nothing leaves this computer.')+`<div class="grid two"><section class="card"><h2>Send a simulated message</h2><form id="sms-form" class="stack" style="margin-top:20px"><div><label for="sender-select">Choose a sender</label><select id="sender-select"><option value="">Custom number / new athlete</option>${people.map(a=>`<option value="${esc(a.phone)}" ${a.phone===selectedPhone?'selected':''}>${esc(a.name)} · #${a.id} · ${esc(a.status)}</option>`).join('')}${coaches.map(c=>`<option value="${esc(c.phone)}">Coach ${esc(c.name)}</option>`).join('')}</select></div><div><label for="phone">Sender phone</label><input id="phone" required type="tel" value="${esc(selectedPhone)}" placeholder="+15550009999"></div><div><label for="kind">Message format</label><select id="kind"><option value="text">Text message</option><option value="voice">Voice note — typed transcript simulation</option></select></div><div><label for="sms-body">Message / simulated transcript</label><textarea id="sms-body" required maxlength="4000" placeholder="Clinch felt sharper today. Kept getting countered off my jab. My shin is sore."></textarea></div><div class="actions"><button>Send into demo</button><button type="button" class="ghost small" data-example="Clinch felt sharper today. Kept getting countered off my jab. My shin is sore.">Example log</button></div><div class="actions">${['JOIN','YES 18','STOP'].map(s=>`<button type="button" class="secondary small" data-example="${s}">${s}</button>`).join('')}</div><p class="note">New athletes: send JOIN, then YES 18 to confirm they are an adult and consent. STOP opts out. Registered coaches use # followed by the athlete ID shown above, then their reply (for example: #1 Great work today). It targets that athlete’s latest unanswered log.</p></form></section><aside><div class="phone"><div class="phone-header"><strong>Gym number</strong><div class="meta">Simulated SMS conversation</div></div><div class="messages" id="conversation"></div></div><div class="card"><h3>Exercise the scheduler</h3><p class="note">Run due nudges and weekly recaps at a selected time. Re-running should not duplicate messages. Gym quiet hours apply.</p><label for="job-time" style="margin-top:15px">Simulated time (include offset)</label><input id="job-time" value="${esc(state.now||state.demo_now||new Date().toISOString())}" placeholder="2026-09-28T20:45:00-04:00"><div class="actions"><button type="button" class="ghost small" id="preset-nudge">After class</button><button type="button" class="ghost small" id="preset-recap">Sunday recap</button></div><button id="run-jobs" class="secondary" style="margin-top:12px">Run due jobs</button><pre id="job-result" style="white-space:pre-wrap;font-size:11px"></pre></div><details><summary>Reset demo data</summary><p class="note">Replaces all local demo changes with the fictional seed.</p><button id="reset" class="ghost small" style="margin-top:10px">Reset fictional demo</button></details></aside></div>`;$('#sender-select').onchange=()=>{$('#phone').value=$('#sender-select').value;selectedPhone=$('#phone').value;renderConversation()};$('#phone').onchange=()=>{selectedPhone=$('#phone').value;renderConversation()};document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('#sms-body').value=b.dataset.example});$('#sms-form').onsubmit=e=>{e.preventDefault();action(async()=>{selectedPhone=$('#phone').value;await api('/api/inbound',{phone:selectedPhone,body:$('#sms-body').value,kind:$('#kind').value});toast('Message processed locally.');await refresh()})};$('#preset-nudge').onclick=()=>{$('#job-time').value=state.demo?.nudge_at||$('#job-time').value};$('#preset-recap').onclick=()=>{$('#job-time').value=state.demo?.recap_at||$('#job-time').value};$('#run-jobs').onclick=()=>action(async()=>{const r=await api('/api/jobs',{now:$('#job-time').value});await refresh();$('#job-result').textContent=JSON.stringify(r,null,2);toast('Scheduled jobs checked.')});$('#reset').onclick=()=>{if(confirm('Replace all demo changes with the fictional seed data?'))action(async()=>{await api('/api/reset',{});currentBrief=null;selectedPhone='';await refresh();toast('Fictional demo restored.')})};renderConversation();}
function renderConversation(){const phone=$('#phone')?.value||selectedPhone;let messages=arr(state.messages).filter(m=>m.from_phone===phone||m.to_phone===phone||m.phone===phone||m.athlete_id===peopleId(phone)).slice().sort((a,b)=>String(a.received_at||a.created_at||a.at).localeCompare(String(b.received_at||b.created_at||b.at)));$('#conversation').innerHTML=messages.length?messages.map(m=>`<div class="bubble ${m.direction==='in'?'in':''}">${esc(m.body)}<div style="font-size:9px;opacity:.7;margin-top:5px">${fmt(m.received_at||m.created_at||m.at)} · ${esc(m.status||'simulated')}</div></div>`).join(''):'<div class="empty">Send a message to start this demo conversation.</div>';$('#conversation').scrollTop=$('#conversation').scrollHeight;}
function peopleId(phone){return arr(state.athletes).find(a=>a.phone===phone)?.id??-1;}
function renderActivity(){$('#screen').innerHTML=heading('Owner demo inspection','Nothing happens off the record.','Simulated messages and stored events. Confidential records are visible in this owner inspection view.')+`<div class="grid two"><section class="card"><div class="card-head"><h2>Message ledger</h2>${badge(arr(state.messages).length+' messages')}</div>${arr(state.messages).slice().reverse().map(m=>`<div class="event"><div class="row between">${badge(m.direction==='out'?'Simulated outbound':'Inbound','gray')}<span class="meta">${fmt(m.received_at||m.created_at||m.at)}</span></div><p class="note">${esc(m.from_phone||(m.direction==='in'?(m.name||athlete(m.athlete_id).name||'Sender'):'Gym'))} → ${esc(m.to_phone||m.phone||(m.direction==='out'?(m.name||athlete(m.athlete_id).name||'Recipient'):'Gym'))}</p><p style="margin-top:7px;white-space:pre-wrap">${esc(m.body)}</p></div>`).join('')||'<p class="muted">No messages yet.</p>'}</section><aside class="card"><h2>Event audit</h2>${arr(state.events).map(e=>`<div class="event"><div class="row between"><code>${esc(e.type||e.event_type)}</code><span class="meta">${fmt(e.at||e.created_at)}</span></div><div class="note">${esc(typeof e.meta==='object'?JSON.stringify(e.meta):e.meta||e.detail||'')}</div></div>`).join('')||'<p class="note">No events yet.</p>'}</aside></div>`;}
function bindGo(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));}
async function navigate(next){tab=next;currentBrief=null;await action(refresh);}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));
refresh().catch(e=>{$('#screen').innerHTML='<div class="card"><h2>Cannot reach the local demo</h2><p class="note">'+esc(e.message)+'</p><button onclick="location.reload()" style="margin-top:15px">Try again</button></div>'});
</script></body></html>
